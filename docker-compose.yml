services:
  mysql:
    image: mysql:8.0
    container_name: flutter_crud_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-store_app}
      MYSQL_USER: ${MYSQL_USER:-store_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-store_password}
    ports:
      # Port host 3307 dipilih agar tidak bentrok dengan MySQL/XAMPP di 3306.
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Script dijalankan otomatis hanya saat volume database pertama kali dibuat.
      - ./backend/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flutter_crud_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-store_app}
      DB_USER: ${MYSQL_USER:-store_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-store_password}
    ports:
      - "8080:80"

  # Antarmuka web untuk melihat isi database dan perubahan CRUD.
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: flutter_crud_phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      # Login phpMyAdmin otomatis menggunakan user aplikasi, tanpa form login.
      # User ini hanya memiliki akses ke database store_app, bukan root MySQL.
      PMA_USER: ${MYSQL_USER:-store_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-store_password}
    ports:
      - "8081:80"

volumes:
  mysql_data:
